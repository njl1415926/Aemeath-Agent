name: aemeath

x-local-logging: &local-logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

x-app-runtime: &app-runtime
  image: ${AEMEATH_IMAGE:-aemeath-agent:local}
  platform: linux/amd64
  user: "10001:10001"
  read_only: true
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
  logging: *local-logging

services:
  api:
    <<: *app-runtime
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${AEMEATH_ENV_FILE:-/etc/aemeath/prod.env}
    environment:
      AEMEATH_ENVIRONMENT: prod
      AEMEATH_TRUSTED_PROXY_IPS: 172.30.0.10
      AEMEATH_API_AUTH_MODE: web_session
      AEMEATH_WEB_PUBLIC_ORIGIN: https://${AEMEATH_DOMAIN:?set AEMEATH_DOMAIN through the approved non-secret env file}
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      AEMEATH_WEB_AUTH_CSRF_KEY_FILE: /run/secrets/web_auth_csrf_key
    expose:
      - "8000"
    volumes:
      - type: bind
        source: /var/lib/aemeath/data
        target: /var/lib/aemeath/data
      - type: bind
        source: /var/log/aemeath
        target: /var/log/aemeath
    secrets:
      - source: deepseek_api_key
        target: deepseek_api_key
      - source: web_auth_csrf_key
        target: web_auth_csrf_key
    networks:
      - frontend
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 75s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).read(1)
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6

  proxy:
    image: aemeath-caddy:2.10.2-nonroot
    build:
      context: .
      dockerfile: deploy/Caddy.Dockerfile
    platform: linux/amd64
    user: "10002:10002"
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    environment:
      AEMEATH_DOMAIN: ${AEMEATH_DOMAIN:?set AEMEATH_DOMAIN through the approved non-secret env file}
      AEMEATH_API_UPSTREAM: api:8000
      XDG_CONFIG_HOME: /config
      XDG_DATA_HOME: /data
    ports:
      - target: 8080
        published: "80"
        protocol: tcp
      - target: 8443
        published: "443"
        protocol: tcp
    volumes:
      - type: volume
        source: caddy_data
        target: /data
      - type: volume
        source: caddy_config
        target: /config
    networks:
      frontend:
        ipv4_address: 172.30.0.10
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget --spider --quiet http://127.0.0.1:2019/config/
          && wget --spider --quiet http://api:8000/health
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 4
    logging: *local-logging

  memory-worker:
    <<: *app-runtime
    profiles:
      - memory
    command:
      - python
      - /opt/aemeath/scripts/deployment/profile_guard.py
      - memory-worker
    network_mode: none
    restart: "no"

  ops:
    <<: *app-runtime
    profiles:
      - ops
    command:
      - python
      - /opt/aemeath/scripts/deployment/backup_sqlite.py
      - --db-path
      - /var/lib/aemeath/data/aemeath.db
      - --backup-root
      - /var/backups/aemeath
      - --backend
      - sqlite_raw
      - --label
      - nightly
      - --app-image-digest
      - ${AEMEATH_APP_IMAGE_DIGEST:-unknown}
      - --ops-image-digest
      - ${AEMEATH_OPS_IMAGE_DIGEST:-unknown}
      - --deploy-lock-sha256
      - ${AEMEATH_DEPLOY_LOCK_SHA256:-unknown}
      - --compose-config-sha256
      - ${AEMEATH_COMPOSE_CONFIG_SHA256:-unknown}
      - --git-commit
      - ${AEMEATH_BUILD_COMMIT:-unknown}
    network_mode: none
    volumes:
      - type: bind
        source: /var/lib/aemeath/data
        target: /var/lib/aemeath/data
        read_only: true
      - type: bind
        source: /var/lib/aemeath/rag_indexes
        target: /var/lib/aemeath/rag_indexes
      - type: bind
        source: /var/log/aemeath
        target: /var/log/aemeath
        read_only: true
      - type: bind
        source: /var/backups/aemeath
        target: /var/backups/aemeath
    restart: "no"

  restore:
    <<: *app-runtime
    profiles:
      - restore
    command:
      - python
      - /opt/aemeath/scripts/deployment/restore_sqlite.py
    network_mode: none
    volumes:
      - type: bind
        source: /var/lib/aemeath/data
        target: /var/lib/aemeath/data
      - type: bind
        source: /var/lib/aemeath/rag_indexes
        target: /var/lib/aemeath/rag_indexes
        read_only: true
      - type: bind
        source: /var/backups/aemeath
        target: /var/backups/aemeath
        read_only: true
    restart: "no"

networks:
  frontend:
    name: aemeath_frontend
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  caddy_data:
    name: aemeath_caddy_data
  caddy_config:
    name: aemeath_caddy_config

secrets:
  deepseek_api_key:
    file: /etc/aemeath/secrets/deepseek_api_key
  web_auth_csrf_key:
    file: /etc/aemeath/secrets/web_auth_csrf_key
