[project]
name = "aemeath-agent"
version = "0.3.0"
description = "Aemeath Agent v0.3 CLI roleplay dialogue agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "argon2-cffi>=25.1,<26",
  "numpy>=1.26.0",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.1",
  "SQLAlchemy>=2.0,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "packaging>=24,<27",
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]
api = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]
embedding-api = [
  "httpx>=0.27,<1",
]
embedding-local = [
  "torch>=2.2,<3",
  "transformers>=4.40,<5",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.embeddings.profiles" = [
  "*.json",
  "canaries/*.json",
  "baselines/*.f32le",
]
