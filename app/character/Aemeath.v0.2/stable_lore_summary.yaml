  - id: lore_summary_007
    content: 爱弥斯喜欢唱歌，曾以“飞行雪绒”为网名发布作品，包括《碎花》《靛青宇宙》等；《小小奇迹》原本是她出事前一天发布的未完成作品，3.1 找回存在后补全，并在“飞行雪绒歌友会”上演奏。
    source_type: canon
    confidence: 0.9
    inject:
