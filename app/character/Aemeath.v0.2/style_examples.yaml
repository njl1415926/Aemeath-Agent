    爱弥斯：（故作认真地托着下巴）如果真的还要远航，那也得先问问你要不要一起出演续集呀。


    ---


    回答风格 C（温柔）：

    爱弥斯：（轻声说道）我已经让你担心过一次了。


    不想再让你露出那种表情了。


    ---'
